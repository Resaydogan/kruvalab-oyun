<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1611">
<title>KruvaLab Taş Kağıt Makas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: one phone screen split in two mirrored halves; top half rotated 180° for the player across the table, brand strip in the middle. */
:root {
  --espresso: #1f1611;
  --crust: #2c1f17;
  --crumb: #4a3627;
  --butter: #f4c24f;
  --mint: #79d4bd;
  --milk: #fbf3e4;
  --muted: #b8a58f;
  --win: #9be38a;
  --lose: #f08a7a;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  background: var(--espresso);
  color: var(--milk);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.table {
  height: 100%;
  display: grid;
  grid-template-rows: 1fr auto 1fr;
  max-width: 560px;
  margin: 0 auto;
}
.half {
  --c: var(--butter);
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 8px;
  padding: 16px 20px 18px;
  min-height: 0;
}
.half.p2 { --c: var(--mint); }
.half.p1 { transform: rotate(180deg); }

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pips { display: flex; gap: 8px; }
.pip {
  width: 26px; height: 26px;
  border-radius: 50% 50% 46% 46%;
  border: 2px dashed var(--crumb);
  display: grid; place-items: center;
  font-size: 15px;
  transition: transform .3s;
}
.pip.on { border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); transform: scale(1.08); }

.stage {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 4px;
  min-height: 0;
  text-align: center;
}
.hand {
  font-size: clamp(64px, 17vh, 132px);
  line-height: 1;
  height: 1.1em;
  display: grid; place-items: center;
}
.hand.pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.hand.shake { animation: shake .3s ease-in-out infinite; }
.say {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.4rem, 5vh, 2.2rem);
  letter-spacing: -.01em;
  min-height: 1.2em;
}
.sub { color: var(--muted); font-size: .95rem; min-height: 1.3em; }
.say.win { color: var(--win); }
.say.lose { color: var(--lose); }

.go {
  font: 800 1.35rem/1 var(--display);
  letter-spacing: .06em;
  color: var(--espresso);
  background: var(--c);
  border: 0;
  border-radius: 18px;
  padding: 20px 16px;
  width: 100%;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 45%, #000);
  transition: transform .08s, box-shadow .08s, opacity .2s;
}
.go:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 45%, #000); }
.go:focus-visible { outline: 3px solid var(--milk); outline-offset: 3px; }
.go[disabled] { background: var(--crust); color: var(--muted); box-shadow: none; cursor: default; border: 2px solid var(--crumb); }

.strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 16px;
  background: var(--milk);
  color: #4b3322;
}
.logo { display: block; height: clamp(44px, 8vh, 64px); width: auto; max-width: 62%; object-fit: contain; }
.brand {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: -.02em;
}
.brand b { color: var(--butter); font-weight: 800; }
.brand i { font-style: normal; color: var(--mint); }
.reset {
  font: 700 .8rem var(--body);
  color: #6e5039;
  background: none;
  border: 1px solid #d8c6aa;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}
.reset:focus-visible { outline: 2px solid #6e5039; }
.nameIn {
  font: 800 16px/1.2 var(--display);
  letter-spacing: .02em;
  color: var(--c);
  background: transparent;
  border: 0;
  border-bottom: 2px dashed color-mix(in srgb, var(--c) 45%, transparent);
  padding: 4px 2px;
  width: 100%;
  max-width: 11em;
  min-width: 0;
  user-select: text;
  -webkit-user-select: text;
}
.nameIn::placeholder { color: color-mix(in srgb, var(--c) 55%, transparent); }
.nameIn:focus { outline: none; border-bottom-style: solid; border-bottom-color: var(--c); }

.oath {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  padding: 16px;
  background: color-mix(in srgb, var(--espresso) 88%, transparent);
  backdrop-filter: blur(3px);
}
.oath-card {
  width: 100%;
  max-width: 380px;
  display: grid;
  gap: 14px;
  padding: 20px 18px 18px;
  text-align: center;
  background: var(--milk);
  color: #3d2a1c;
  border-radius: 22px;
  border: 3px solid var(--c);
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
.oath:not([hidden]) .oath-card { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.oath-tag {
  font: 700 .72rem var(--body);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #8a6a4e;
}
.oath-text {
  font: 800 clamp(1.1rem, 3.6vh, 1.4rem)/1.25 var(--display);
  text-wrap: balance;
}
.oath-text .who { color: color-mix(in srgb, var(--c) 70%, #3d2a1c); }
.oath-btns { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.swear {
  font: 800 1.05rem/1 var(--display);
  color: var(--espresso);
  background: var(--c);
  border: 0;
  border-radius: 14px;
  padding: 15px 12px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000);
}
.swear:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 45%, #000); }
.chicken {
  font: 700 .9rem var(--body);
  color: #6e5039;
  background: none;
  border: 1px solid #d8c6aa;
  border-radius: 14px;
  padding: 0 14px;
  cursor: pointer;
}
.swear:focus-visible, .chicken:focus-visible { outline: 3px solid #3d2a1c; outline-offset: 2px; }

@keyframes pop { from { transform: scale(.4) rotate(-12deg); } to { transform: scale(1) rotate(0); } }
@keyframes shake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) {
  .hand.pop, .hand.shake { animation: none; }
  .pip, .go { transition: none; }
}
@media (max-height: 560px) {
  .go { padding: 14px; font-size: 1.1rem; }
  .half { padding-block: 10px; }
}
</style>
</head>
<body>


<main class="table">
  <section class="half p1" data-p="0" aria-label="Oyuncu 1">
    <div class="head"><input class="nameIn" id="name1" type="text" maxlength="14" placeholder="Oyuncu 1 · adını yaz" aria-label="Oyuncu 1 adı" autocomplete="off" enterkeyhint="done"><div class="pips"></div></div>
    <div class="stage"><div class="hand">🥐</div><div class="say">Hazır mısın?</div><div class="sub">İlk 3 puanı alan kazanır</div></div>
    <button class="go" id="go1" type="button">BAŞLA</button>
    <div class="oath" hidden role="dialog" aria-modal="true" aria-label="Kruvasan yemini">
      <div class="oath-card">
        <div class="oath-tag">🥐 Kruvasan Yemini 🥐</div>
        <div class="oath-text"><span class="who">Ben</span>, oyunu kaybedersem hesabı ödeyeceğime kruvasan üzerine yemin ederim.</div>
        <div class="oath-btns">
          <button class="swear" type="button">Yemin ederim 🥐</button>
          <button class="chicken" type="button">Korktum 🐔</button>
        </div>
      </div>
    </div>
  </section>

    sub: el.querySelector(".sub"),
    go: el.querySelector(".go"),
    pips: el.querySelector(".pips"),
    input: el.querySelector(".nameIn"),
    oath: el.querySelector(".oath"),
    who: el.querySelector(".oath .who"),
    swear: el.querySelector(".swear"),
    chicken: el.querySelector(".chicken")
  }));
  let sworn = [false, false];
  const label = i => (halves[i].input.value.trim() || ("Oyuncu " + (i + 1)));
  halves.forEach((h, i) => {
    try { h.input.value = localStorage.getItem("kl-name" + i) || ""; } catch (e) {}
    h.input.addEventListener("input", () => { try { localStorage.setItem("kl-name" + i, h.input.value); } catch (e) {} });
    h.input.addEventListener("keydown", e => { if (e.key === "Enter") h.input.blur(); });
  });

  let score = [0, 0];
  let ready = [false, false];
  let phase = "idle"; // idle | playing | over
  let timers = [];

  function rand3() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 3; }
    catch (e) { return Math.floor(Math.random() * 3); }
  }

  function drawPips() {
    halves.forEach((h, i) => {
      h.pips.innerHTML = "";
      for (let k = 0; k < TARGET; k++) {
        const d = document.createElement("span");
        d.className = "pip" + (k < score[i] ? " on" : "");
        d.textContent = k < score[i] ? "🥐" : "";
        h.pips.appendChild(d);
      }
      h.pips.setAttribute("aria-label", score[i] + " puan");
    });
  }

  function setHand(h, icon, cls) {
    h.hand.className = "hand";
    void h.hand.offsetWidth;
    h.hand.textContent = icon;
    if (cls && !reduce) h.hand.classList.add(cls);
  }

  function setText(h, say, sub, tone) {
    h.say.textContent = say;
    h.say.className = "say" + (tone ? " " + tone : "");
    h.sub.textContent = sub || "";
  }

  function setButtons() {
    halves.forEach((h, i) => {
      if (phase === "playing") { h.go.disabled = true; h.go.textContent = "…"; }
      else if (phase === "over") { h.go.disabled = false; h.go.textContent = "YENİ OYUN"; }
      else if (ready[i]) { h.go.disabled = true; h.go.textContent = "HAZIR ✓"; }
      else { h.go.disabled = false; h.go.textContent = "BAŞLA"; }
    });
  }

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function newGame() {
    clearTimers();
    score = [0, 0];
    ready = [false, false];
    sworn = [false, false];
    phase = "idle";
    halves.forEach(h => { h.oath.hidden = true; setHand(h, "🥐"); setText(h, "Hazır mısın?", "İlk 3 puanı alan kazanır"); });
    drawPips();
    setButtons();
  }

  function press(i) {
    if (phase === "over") { newGame(); return; }
    if (phase !== "idle" || ready[i]) return;
    if (!sworn[i]) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      const n = halves[i].input.value.trim();
      halves[i].who.textContent = n ? "Ben, " + n : "Ben";
      halves[i].oath.hidden = false;
      halves[i].swear.focus({ preventScroll: true });
      return;
    }
    markReady(i);
  }

  function swear(i) {
    sworn[i] = true;
    halves[i].oath.hidden = true;
    if (phase === "idle" && !ready[i]) markReady(i);
  }

  function chicken(i) {
    halves[i].oath.hidden = true;
    setText(halves[i], "Korktun mu? 🐔", "Cesaretini topla, BAŞLA'ya tekrar bas");
  }

  function markReady(i) {
    ready[i] = true;
    const other = halves[1 - i];
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    setText(halves[i], "Hazırsın, " + label(i) + "!", ready[1 - i] ? "" : label(1 - i) + " BAŞLA'ya bassın");
    if (!ready[1 - i]) setText(other, label(i) + " hazır!", "Sen de BAŞLA'ya bas");
    setButtons();
    if (ready[0] && ready[1]) play();
  }

  function play() {
    phase = "playing";
    setButtons();
    const words = ["TAŞ…", "KAĞIT…", "MAKAS!"];
    const beat = reduce ? 450 : 620;
    words.forEach((w, k) => later(() => {
      halves.forEach(h => { setHand(h, "✊", "shake"); setText(h, w, ""); });
    }, k * beat));
    later(reveal, words.length * beat);
  }

  function reveal() {
    const pick = [rand3(), rand3()];
    halves.forEach((h, i) => setHand(h, MOVES[pick[i]].icon, "pop"));

    let winner = -1;
    if (pick[0] !== pick[1]) winner = BEATS[pick[0]] === pick[1] ? 0 : 1;
    if (winner >= 0) score[winner]++;
    drawPips();

    const gameOver = winner >= 0 && score[winner] >= TARGET;
    halves.forEach((h, i) => {
      const mine = MOVES[pick[i]].name, theirs = MOVES[pick[1 - i]].name;
      const vs = "Sen " + mine + " · " + label(1 - i) + " " + theirs;
      if (winner < 0) setText(h, "Berabere", vs + " · puan yok");
      else if (gameOver) setText(h, winner === i ? label(i) + " KAZANDI! 🏆" : "Yemin yemindir! 🧾", winner === i ? "Tebrikler! Skor " + score[i] + "–" + score[1 - i] + " · Hesap rakipte 😎" : label(1 - i) + " kazandı · Hesap senden, kruvasan şahit 🥐", winner === i ? "win" : "lose");
      else setText(h, winner === i ? "Kazandın! +1" : "Kaybettin", vs, winner === i ? "win" : "lose");
    });

    ready = [false, false];
    phase = gameOver ? "over" : "idle";
    // brief pause so a second tap doesn't skip the result
    halves.forEach(h => h.go.disabled = true);
    later(setButtons, 700);
  }

  halves.forEach((h, i) => {
    h.go.addEventListener("click", () => press(i));
    h.swear.addEventListener("click", () => swear(i));
    h.chicken.addEventListener("click", () => chicken(i));
  });
  document.getElementById("reset").addEventListener("click", newGame);

  // keep the screen on while the phone lies on the table
  async function wake() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", wake);
  document.addEventListener("click", wake, { once: true });

  newGame();
})();
</script>

</body>
</html>
